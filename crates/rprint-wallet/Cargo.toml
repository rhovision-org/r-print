[package]
name = "rprint-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Key handling, deploy signing and reply decoding for the r-print client."

[lints]
workspace = true

[dependencies]
rprint-core.workspace = true
rprint-keystore.workspace = true
rchain-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# rcash-chain selects its transport by target architecture. Its signing and value
# encoding path is transport-independent; only the node client differs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rcash-chain = { workspace = true, features = ["wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcash-chain = { workspace = true, features = ["native"] }
