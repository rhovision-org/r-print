name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv
      - run: make spec-check

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r harness/requirements.txt
      - run: python3 tools/check_lean.py
      - run: python3 tools/check_lean_vectors.py
      - run: python3 tools/check_flows.py --strict

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - run: make venv
      - run: make docs-check PY=python3

  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make venv
      - run: make build
      - run: make parse-check RCHAIN_RUST_DIR="$PWD/rnode-rust"

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p rprint-wasm --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser fixture e2e (no node, no WASM)
        run: make web-e2e-fixture
      - run: make client-wasm-pack
      - run: make client-wasm-smoke
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - name: Upload Playwright fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fixture
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  devnet:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/r-cash
          ref: 49b441dea4f5561992387ed670ab263fcd5dd164
          path: rholo
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the node image and the r-cash CLI
        run: |
          (cd rnode-rust && tools/devnet.sh build)
          cargo build --manifest-path rholo/Cargo.toml -p rcash-cli
      - run: make venv
      - name: Start the r-cash devnet
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: |
          make -C rholo venv
          make devnet-up
          make rcash-keys
          make rcash-bootstrap
          make keys
      - name: Install r-print and run the suites
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: |
          make install
          make unit-all
      - name: Live client smoke
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: |
          npm ci --prefix web --no-audit --no-fund
          make client-live
          make cli-live
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser live e2e
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: make web-e2e-live NODE=http://127.0.0.1:40403
      - name: Upload browser e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: |
            web/playwright-report/
            web/test-results/
            deployments/browser-e2e-results.json
          if-no-files-found: ignore
      - name: Upload suite and live-client results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results
          path: |
            deployments/suite-results.json
            deployments/live-client-results.json
