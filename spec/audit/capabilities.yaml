    disposition: finding
    evidence: contracts/src/deploy/06_rsure.rho:126
  - id: CAP-026
    name: state-cells
    kind: private-name
    source: contracts/src/deploy/11_publication_cell.rho:1
    source_atom: ''
    creator: each factory
    holders: the owning contract
    exposure: closure-only
    attenuation: one cell per entity
    authority_check: none
    arms: []
    delegation: []
    revocation: none
    forge_path: none while the cell stays in the owning closure
    hazard: a leaked state cell lets a caller rewrite the entity
    disposition: holds
    evidence: contracts/src/deploy/11_publication_cell.rho
  - id: CAP-027
