    disposition: holds
    evidence: contracts/src/deploy/31_edition.rho:416
  - id: CAP-023
    name: Edition
    kind: published-contract
    source: contracts/src/deploy/31_edition.rho:386
    source_atom: 'bundle+{*Edition}'
    creator: EditionFactory
