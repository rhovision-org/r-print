  - id: CAP-024
    name: RgenAdapter
    kind: published-contract
    source: contracts/src/deploy/05_rgen.rho:209
    source_atom: 'bundle+{*RgenAdapter}'
    creator: PrintRoot installer
    holders: every deploy that resolves component:rgen-adapter
