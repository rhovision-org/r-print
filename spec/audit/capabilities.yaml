  - id: CAP-025
    name: RsureAdapter
    kind: published-contract
    source: contracts/src/deploy/06_rsure.rho:126
    source_atom: 'bundle+{*RsureAdapter}'
    creator: PrintRoot installer
    holders: every deploy that resolves component:rsure-adapter
