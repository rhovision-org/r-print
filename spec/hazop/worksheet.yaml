    severity: S3
    likelihood: C
    risk: 4
    action: none
    finding: '-'
    negative: true
    disposition: no-finding
  - id: HZ-PUB-004
    node: publication
    guide_word: Substitute/confused-deputy
    parameter: role
    deviation: a writer writes the roster
