# Cornerstone flow manifest. `status` is the behavioural label:
# `implemented` (source arm exists and a suite exercises it), `surface` (optional
# sibling adapter), `design` (not deployed), `owed` (not yet covered).
# `lean` names the theorem that carries the arm's safety obligation and
# `lean_status` is `proved-model`, `modeled`, `assumption` or `owed`.
# `proved-model` means proved about the shallow Lean model, not a refinement of
# the deployed Rholang.
schema: rprint.flows/v1
subsystem: cornerstone
source_globs:
  - contracts/src/deploy/10_publication.rho
  - contracts/src/deploy/11_publication_cell.rho
  - contracts/src/deploy/20_commission.rho
  - contracts/src/deploy/21_commission_escrow.rho
  - contracts/src/deploy/30_article.rho
  - contracts/src/deploy/31_edition.rho
  - contracts/src/deploy/05_rgen.rho
  - contracts/src/deploy/06_rsure.rho
invariants:
  I1: {statement: "one cell, consume and repost once; a commit is all-or-none", lean: RPrint.commit_all_or_none, lean_status: proved-model}
  I2: {statement: "canonical masthead binding", lean_status: assumption}
  I3: {statement: "member identity is the derived REV address", lean_status: assumption}
  I4: {statement: "the last publisher cannot be removed or demoted", lean: RPrint.publication_removeMember_refuses_last_publisher, lean_status: proved-model}
  I5: {statement: "solo publication and platform quorum rules", lean: RPrint.publication_solo_arbitration_platform, lean_status: proved-model}
  I6: {statement: "a commission is funded once, upfront, for the full total", lean: RPrint.commission_fund_creates_active_escrow, lean_status: proved-model}
  I7: {statement: "release requires a prior submit and prior milestones", lean: RPrint.escrow_release_requires_prior, lean_status: proved-model}
  I8: {statement: "a milestone pays at most once", lean: RPrint.escrow_release_pays_once, lean_status: proved-model}
  I9: {statement: "terminal escrow conservation", lean: RPrint.escrow_terminal_conserved, lean_status: proved-model}
  I10: {statement: "cancel, expire and resolve refund at most the remaining balance", lean: RPrint.escrow_cancel_conserves, lean_status: proved-model}
  I11: {statement: "solo publisher arbitration fallback", lean_status: assumption}
  I12: {statement: "a published content hash is frozen", lean: RPrint.article_publish_freezes_hash, lean_status: proved-model}
  I13: {statement: "corrections are append-only", lean: RPrint.article_correct_append_only, lean_status: proved-model}
  I14: {statement: "a retraction appends a record", lean: RPrint.article_retract_appends_record, lean_status: proved-model}
  I15: {statement: "an edition append requires a published article from the publication", lean: RPrint.edition_append_guards, lean_status: proved-model}
  I16: {statement: "a sealed edition is bound and immutable", lean: RPrint.edition_sealed_manifest_immutable, lean_status: proved-model}
  I17: {statement: "BYOID DID and attestation fields are anchors, not proof", lean: RPrint.publication_attest_preserves_authority, lean_status: proved-model, note: "DID verification is off-chain; the theorem only shows attestSelf leaves authority unchanged"}
  I18: {statement: "a quantum-os coordination record is provenance, not authority", lean_status: design, note: "spec/spec-only.md"}
  I19: {statement: "money is integer minor units; block heights carry deadlines", lean: RPrint.shareOf_le, lean_status: proved-but-narrower, note: "Nat minor units and Height; not a type-level money proof"}
  I20: {statement: "spec-only features do not change v0.1 cell semantics", lean_status: design, note: "spec/spec-only.md"}
  I21: {statement: "a client write succeeds only after finalized + processedWithSuccess + a (true, ...) reply", lean_status: mechanism, note: "web/src/test/live-api.test.ts; crates/rprint-sdk"}
  I22: {statement: "reads use explore-deploy; writes use signed-deploy", lean_status: mechanism, note: "crates/rprint-sdk/src; AGENTS.md"}
  I23: {statement: "an ambiguous submit reuses the op id and the key stays in WASM", lean_status: mechanism, note: "crates/rprint-wasm; deployments/live-client-results.json"}
  I24: {statement: "an attached cover is active, insured to the treasury and asset-bound", lean: RPrint.cover_attach_requires_insured, lean_status: proved-model, note: "see cover_attach_requires_active_policy and cover_attach_requires_asset"}
  I25: {statement: "a knowledge link requires the reciprocal authored chain", lean: RPrint.knowledge_attach_requires_provenance_hash, lean_status: proved-model, note: "see the reciprocal, author and credential theorems"}
  I26: {statement: "a sibling link is single-assignment; an identical link is a replay", lean: RPrint.cover_attach_single_assignment, lean_status: proved-model, note: "see knowledge_attach_single_assignment"}
rules:
  - id: P-member
    arm: 'Publication@"addMember"'
    source: contracts/src/deploy/11_publication_cell.rho
    cell: Publication
    guard_eq: RPrint.publicationAddMember_guard_eq
    corpus: PUB-add-nonpublisher
    suite: harness/unit_membership_auth.py
    status: implemented
    lean: RPrint.publication_addMember_requires_publisher
    lean_status: proved-conformance
  - id: P-remove
