schema: rprint.guards/v1
scope: mutating arms in the eight cornerstone deploy terms
method: >-
  Each row names the deployed arm, the model transition behind it, the source
  atoms that must be present, and a guard_eq theorem over the shallow model.
  This is a drift check and a model guard bridge, not an extraction or a
  semantics-preserving refinement of the deployed Rholang.

shared_atoms:
  contracts/src/deploy/11_publication_cell.rho:
    - clock
    - codec
    - terms
    - unknown
    - publication
  contracts/src/deploy/20_commission.rho:
    - clock
    - terms
    - unknown
    - duplicate
    - membership
    - publication
    - proposal
  contracts/src/deploy/21_commission_escrow.rho:
    - clock
    - unknown
  contracts/src/deploy/30_article.rho:
    - clock
    - terms
    - unknown
    - duplicate
    - membership
    - publication
  contracts/src/deploy/31_edition.rho:
    - clock
    - codec
    - terms
    - unknown
    - duplicate
    - publication
  contracts/src/deploy/05_rgen.rho:
    - claim-factory
    - credential-factory
    - disabled
    - identity-directory
    - membership
    - provenance-factory
    - uri
  contracts/src/deploy/06_rsure.rho:
    - disabled
    - distribution-factory
    - line-factory
    - membership
    - policy-factory
    - slip-factory

arms:
  - id: publication.factory.create
    source: contracts/src/deploy/10_publication.rho
    contract: PublicationFactory
    arm: create
    cell: PublicationFactory
    status: proved
    guard_eq: RPrint.publicationFactoryCreate_guard_eq
    atoms: [clock, codec, duplicate, member, not owner, publication, publication cell, role, terms, unknown]
    modeled_atoms: [clock, codec, duplicate, member, not owner, publication, publication cell, role, terms, unknown]
    unmodelled_atoms: []
    note: the factory guard models authority, each external validation as a Bool atom, and id reuse; it does not model charter or roster semantics

  - id: publication.addMember
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: addMember
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationAddMember_guard_eq
    atoms: [duplicate, member, members, not owner, paused, role, unknown member]
    modeled_atoms: [duplicate, member, members, not owner, paused, role, unknown member]
    unmodelled_atoms: []
    note: publisher, cap and duplicate are in the model

  - id: publication.removeMember
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: removeMember
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationRemoveMember_guard_eq
    atoms: [last publisher, not member, not owner, paused, role, unknown member]
    modeled_atoms: [last publisher, not member, not owner, paused, role, unknown member]
    unmodelled_atoms: []

  - id: publication.setRole
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: setRole
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationSetRole_guard_eq
    atoms: [last publisher, not member, not owner, paused, role, unknown member]
    modeled_atoms: [last publisher, not member, not owner, paused, role, unknown member]
    unmodelled_atoms: []

  - id: publication.attestSelf
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: attestSelf
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationAttestSelf_guard_eq
    atoms: [not member, not owner]
    modeled_atoms: [not member, not owner]
    unmodelled_atoms: []
    note: the DID anchor is data, not authority

  - id: publication.pause
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: pause
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationPause_guard_eq
    atoms: [not owner, paused, role]
    modeled_atoms: [not owner, paused, role]
    unmodelled_atoms: []

  - id: publication.admin
    source: contracts/src/deploy/11_publication_cell.rho
    contract: Publication
    arm: admin
    cell: Publication
    status: proved
    guard_eq: RPrint.publicationAdmin_guard_eq
    atoms: [below threshold, not owner, platform admin, replay, unknown action]
    modeled_atoms: [below threshold, not owner, platform admin, replay, unknown action]
    unmodelled_atoms: []

  - id: commission.propose
    source: contracts/src/deploy/20_commission.rho
    contract: CommissionFactory
    arm: propose
    cell: CommissionFactory
    status: proved
    guard_eq: RPrint.commissionPropose_guard_eq
    atoms: [not owner, paused, role, status]
    modeled_atoms: [not owner, paused, role, status]
    unmodelled_atoms: []
    note: terms and milestone validation are checked before the transition and are not modelled

  - id: commission.accept
    source: contracts/src/deploy/20_commission.rho
    contract: CommissionProposal
    arm: accept
    cell: CommissionProposal
    status: proved
    guard_eq: RPrint.commissionAccept_guard_eq
    atoms: [not owner, paused, role, status]
    modeled_atoms: [not owner, paused, role, status]
    unmodelled_atoms: []

  - id: commission.fund
    source: contracts/src/deploy/20_commission.rho
    contract: CommissionProposal
    arm: fund
    cell: CommissionProposal
    status: proved
    guard_eq: RPrint.commissionFund_guard_eq
    atoms: [escrow factory, not owner, paused, status]
    modeled_atoms: [escrow factory, not owner, paused, status]
    unmodelled_atoms: []
    note: any signer may fund; the escrow factory result is a boundary read

  - id: commission.cancel
    source: contracts/src/deploy/20_commission.rho
    contract: CommissionProposal
    arm: cancel
    cell: CommissionProposal
    status: proved
    guard_eq: RPrint.commissionCancel_guard_eq
    atoms: [not owner, paused, role, status]
    modeled_atoms: [not owner, paused, role, status]
