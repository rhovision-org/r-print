    status: proved
    guard_eq: RPrint.escrowSubmit_guard_eq
    atoms: [milestone, not owner, not submitted, not writer, role, status, too late]
    modeled_atoms: [milestone, not owner, not submitted, not writer, role, status, too late]
    unmodelled_atoms: []
    note: the model reads the consumed milestone and its block-height deadline

  - id: escrow.release
    source: contracts/src/deploy/21_commission_escrow.rho
    contract: CommissionEscrow
    arm: release
    cell: CommissionEscrow
    status: proved
    guard_eq: RPrint.escrowRelease_guard_eq
    atoms: [editor, milestone, not owner, not submitted, role, status]
    modeled_atoms: [editor, milestone, not owner, not submitted, role, status]
    unmodelled_atoms: []
    note: the model reads the consumed milestone and its amount

  - id: escrow.cancel
    source: contracts/src/deploy/21_commission_escrow.rho
    contract: CommissionEscrow
    arm: cancel
    cell: CommissionEscrow
    status: proved
    guard_eq: RPrint.escrowCancel_guard_eq
    atoms: [closed, not owner, role, status]
    modeled_atoms: [closed, not owner, role, status]
    unmodelled_atoms: []

  - id: escrow.expire
    source: contracts/src/deploy/21_commission_escrow.rho
