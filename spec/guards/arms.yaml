    contract: CommissionProposal
    arm: attachCover
    cell: CommissionProposal
    status: proved
    guard_eq: RPrint.coverAttach_guard_eq
    atoms: [asset, cover, insured, not owner, paused, policy, policy status, role, rsure adapter, status]
    modeled_atoms: [asset, cover, insured, not owner, paused, policy, policy status, role, rsure adapter, status]
    unmodelled_atoms: []
    note: the policy facts are a boundary read; the guard checks active, insured, asset and single assignment

  - id: escrow.factory.createFunded
    source: contracts/src/deploy/21_commission_escrow.rho
    contract: CommissionEscrowFactory
    arm: createFunded
    cell: CommissionEscrowFactory
    status: proved
    guard_eq: RPrint.escrowFactoryCreateFunded_guard_eq
    atoms: [below threshold, not owner, payments]
    modeled_atoms: [below threshold, not owner, payments]
    unmodelled_atoms: []
    note: the factory guard models authority, the threshold check and the purse move as Bool atoms, plus id reuse

  - id: escrow.submit
