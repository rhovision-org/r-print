  - id: article.attachKnowledge
    source: contracts/src/deploy/30_article.rho
    contract: Article
    arm: attachKnowledge
    cell: Article
    status: proved
    guard_eq: RPrint.articleAttachKnowledgeChain_guard_eq
    atoms: [author, claim, claim kasset, claim status, credential, kasset, kasset claim, knowledge, membership, not owner, provenance, provenance asset, provenance claim, provenance hash, rgen adapter, role, status]
    modeled_atoms: [author, claim, claim kasset, claim status, credential, kasset, kasset claim, knowledge, membership, not owner, provenance, provenance asset, provenance claim, provenance hash, rgen adapter, role, status]
    unmodelled_atoms: []
    note: the composite guard models article authority, status and role, adapter resolution, the membership arm, and the r-gen chain facts; it is a guard-structure composition, not a refinement

