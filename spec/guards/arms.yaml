  - id: article.factory.create
    source: contracts/src/deploy/30_article.rho
    contract: ArticleFactory
    arm: create
    cell: ArticleFactory
    status: proved
    guard_eq: RPrint.factoryCreate_guard_eq
    atoms: [not owner]
    modeled_atoms: [not owner]
    unmodelled_atoms: []
    note: the factory arm's own guard is authority plus id reuse; article terms are validated by the cell factory

  - id: article.submit
    source: contracts/src/deploy/30_article.rho
    contract: Article
    arm: submit
